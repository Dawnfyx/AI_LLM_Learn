<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>流式输出演示</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 80px; margin-bottom: 8px; padding: 8px; box-sizing: border-box; }
    button { padding: 8px 24px; background: #4f46e5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #output { margin-top: 20px; padding: 16px; background: #f8f8f8; border-radius: 6px;
               min-height: 100px; white-space: pre-wrap; line-height: 1.7; }
    .cursor { display: inline-block; width: 2px; height: 1em; background: #333; animation: blink .7s infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:0 } }
  </style>
</head>
<body>
  <h2>大模型流式输出演示</h2>
  <textarea id="input" placeholder="输入你的问题...">解释一下什么是 Vue3 的响应式系统</textarea>
  <button id="btn" onclick="sendMessage()">发送</button>
  <div id="output"></div>

  <script>
    async function sendMessage() {
      const btn = document.getElementById('btn')
      const output = document.getElementById('output')
      const message = document.getElementById('input').value.trim()
      if (!message) return

      btn.disabled = true
      output.innerHTML = '<span class="cursor"></span>'

      let fullText = ''

      // EventSource 不支持 POST，用 fetch + ReadableStream 手动解析 SSE
      const res = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message }),
      })

      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''

      while (true) {
        const { value, done } = await reader.read()
        if (done) break

        buffer += decoder.decode(value, { stream: true })
        const lines = buffer.split('\n')
        buffer = lines.pop() // 保留未完整的行

        for (const line of lines) {
          if (line.startsWith('data: ')) {
            try {
              const data = JSON.parse(line.slice(6))
              if (data.token) {
                fullText += data.token
                output.innerHTML = fullText + '<span class="cursor"></span>'
              }
            } catch {}
          }
          if (line === 'event: done') {
            output.innerHTML = fullText
            btn.disabled = false
          }
        }
      }

      btn.disabled = false
    }
  </script>
</body>
</html>
