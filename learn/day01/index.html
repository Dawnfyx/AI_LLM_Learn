<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: currentColor;
      vertical-align: text-bottom;
      animation: blink .7s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0 } }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script>
    const { createApp, ref } = Vue
    
    createApp({
      template: `
        <div style="max-width: 600px; margin: 40px auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
          <h1 style="text-align: center; color: #333; margin-bottom: 30px;">AI 聊天助手</h1>
          <textarea 
            v-model="input" 
            placeholder="输入你的问题..." 
            rows="3" 
            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: vertical; font-size: 14px;"
          />
          <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
            <button 
              @click="send" 
              :disabled="loading"
              style="padding: 10px 24px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; transition: background 0.2s;"
            >{{ loading ? '生成中...' : '发送' }}</button>
          </div>
          <div class="output" style="margin-top: 20px; padding: 16px; background: #f8fafc; border-radius: 8px; min-height: 100px; white-space: pre-wrap; line-height: 1.6;">
            {{ output }}<span v-if="loading" class="cursor" />
          </div>
        </div>
      `,
      setup() {
        const input = ref('')
        const output = ref('')
        const loading = ref(false)
        
        async function send() {
          if (!input.value.trim() || loading.value) return
          loading.value = true
          output.value = ''
          
          const res = await fetch('/api/chat/stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: input.value }),
          })
          
          const reader = res.body.getReader()
          const decoder = new TextDecoder()
          let buffer = ''
          
          while (true) {
            const { value, done } = await reader.read()
            if (done) break
            
            buffer += decoder.decode(value, { stream: true })
            const lines = buffer.split('\n')
            buffer = lines.pop()
            
            for (const line of lines) {
              if (line.startsWith('data: ')) {
                try {
                  const data = JSON.parse(line.slice(6))
                  if (data.token) output.value += data.token
                } catch {}
              }
              if (line === 'event: done') loading.value = false
            }
          }
          
          loading.value = false
        }
        
        return { input, output, loading, send }
      }
    }).mount('#app')
  </script>
</body>
</html>
