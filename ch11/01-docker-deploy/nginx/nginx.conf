# 01-docker-deploy/nginx/nginx.conf
worker_processes auto;
events { worker_connections 1024; }

http {
  # 基础配置
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 20M;

  # Gzip 压缩
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 1024;

  # 隐藏版本号
  server_tokens off;

  # 限流（防止恶意请求）
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;
  limit_req_zone $binary_remote_addr zone=chat:10m rate=5r/m;

  # 上游服务
  upstream app_backend {
    server app:3000;
    keepalive 32;
  }

  # HTTP → HTTPS 重定向
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS 主配置
  server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 安全响应头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    # 前端静态文件（Vue/React 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;  # SPA 路由支持

      # 静态资源长缓存
      location ~* \.(js|css|png|jpg|gif|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }
    }

    # API 路由转发
    location /api/ {
      limit_req zone=api burst=10 nodelay;

      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_read_timeout 30s;
    }

    # SSE 长连接（流式 AI 回复）
    location /api/chat/stream {
      limit_req zone=chat burst=3 nodelay;

      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # SSE 关键配置
      proxy_buffering off;           # 禁用缓冲，实时推送
      proxy_cache off;
      proxy_read_timeout 300s;       # 流式连接允许更长时间
      proxy_http_version 1.1;
      proxy_set_header Connection '';
    }
  }
}
